[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-kivy"
version = "0.1.0"
description = "Explicit Kivy-inspired native Termux:GUI runtime for Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["termux", "termuxgui", "android", "kivy", "gui"]
dependencies = []

[project.optional-dependencies]
android = ["termuxgui>=0.1.5"]

[tool.setuptools.packages.find]
include = ["termux_kivy*"]
