name: Python core and mock Android backend
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare build backend
        run: python -m pip install 'setuptools>=61' wheel
      - name: Install
        run: python -m pip install --no-build-isolation -e .
      - name: Compile
        run: python -m compileall -q termux_kivy tests examples
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Process-isolated interactive test-all suite
        if: matrix.python-version == '3.12'
        run: |
          python test-all.py --delay 0 --timeout 45 --log-file logs/test-all-ci.txt
          grep -q 'FINAL STATUS: PASSED' logs/test-all-ci.txt
      - name: Upload combined transcript
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: termux-kivy-test-all-transcript
          path: logs/test-all-ci.txt
          if-no-files-found: warn
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Smoke-test installed wheel outside source checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/termux_kivy-*.whl
          cd "$(mktemp -d)"
          python -m termux_kivy doctor --json
          python -m pip check
